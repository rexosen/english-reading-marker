<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3"><meta name="color-scheme" content="light"><title>英语阅读标记器</title>
<style>
:root{--blue:#315fbd;--ink:#203044;--muted:#718198;--bg:#f4f6fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}select{width:100%;border:1px solid #cedaeb;border-radius:12px;padding:12px;background:white;color:var(--ink)}button{border:1px solid #dce5f2;border-radius:12px;padding:11px 14px;background:#fff;color:var(--blue)}button:active{background:#e7efff}button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button.small{font-size:14px;padding:8px 10px}.top{position:sticky;top:0;z-index:5;background:#f4f6faf5;backdrop-filter:blur(12px);padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #e4eaf4}.brand{font-weight:750;font-size:20px}.subtitle,#syncStatus{font-size:12px;color:var(--muted);margin-top:5px}.tabs{display:flex;gap:8px;padding:12px 18px}.tabs button{flex:1}.tabs button.active{background:#e4edff;color:#204d9f}main{padding:4px 18px 100px;max-width:780px;margin:auto}.card{padding:18px;margin-bottom:12px;background:white;border:1px solid #e2e8f2;border-radius:18px;overflow-wrap:anywhere}.row{display:flex;gap:8px;align-items:center}.row .grow{flex:1;min-width:0}.title{font-size:19px;font-weight:700;margin-bottom:6px;overflow-wrap:anywhere}.muted{color:var(--muted);font-size:14px;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.empty{text-align:center;padding:36px 14px;line-height:1.8;color:var(--muted)}label{display:block;font-size:14px;margin:18px 0 7px}input,textarea{width:100%;border:1px solid #cedaeb;border-radius:12px;padding:13px;color:var(--ink);background:white}textarea{min-height:220px;resize:vertical}h2{font-size:22px;margin:12px 0}#readingArea{white-space:pre-wrap;font-family:Georgia,'Times New Roman',serif;font-size:21px;line-height:1.75;background:white;border-radius:18px;padding:20px 18px;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}#readingArea .token{scroll-margin-top:150px}#readingArea .marked{text-decoration:underline;text-decoration-color:#cf713f;text-underline-offset:5px;text-decoration-thickness:2px}.readControls{position:sticky;top:76px;background:var(--bg);padding:5px 0 10px;z-index:3}.readControls .actions{margin:4px 0}.selectionBar{position:fixed;bottom:0;left:0;right:0;padding:12px;background:white;border-top:1px solid #dce5f2;z-index:9;display:flex;gap:6px;justify-content:center}.selectionBar button{font-size:14px}.overlay{position:fixed;inset:0;background:#17283e55;z-index:20;display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:720px;max-height:78vh;overflow:auto;background:white;border-radius:24px 24px 0 0;padding:20px 20px 28px}.sheet h3{margin:4px 0 14px;overflow-wrap:anywhere;font-size:20px}.definition{white-space:pre-wrap;line-height:1.7;max-height:36vh;overflow:auto;overflow-wrap:anywhere;color:#274b8e}.conflict{border-left:4px solid #e3a653}#toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#203044f0;color:white;padding:12px 16px;border-radius:12px;max-width:90%;z-index:40;font-size:14px;pointer-events:none}[hidden]{display:none!important}a{color:var(--blue)}
.tabs{overflow-x:auto}.tabs button{white-space:nowrap;font-size:14px;padding:10px}.selectionBar{flex-wrap:wrap;padding:8px}.selectionBar button{padding:8px;font-size:13px}#readingArea .speaking{background:#ffcc6680;border-radius:3px}.sentenceControls{padding:10px;margin-bottom:10px;background:#eaf0fa;border-radius:12px}.sentenceControls select,.sentenceControls input{width:auto;max-width:120px;font-size:13px;padding:7px}.reader-note{font-size:14px}.reviewWord{font-size:38px;font-weight:700;padding:18px 0}.reviewContext{white-space:pre-wrap;line-height:1.9}.noteText{white-space:pre-wrap;line-height:1.8}.preview{min-height:150px;padding:18px;border-radius:14px}.readControls{position:static}#main{transition:background-color .15s}.sheet textarea{min-height:110px}.sheet .actions{flex-wrap:wrap}button:disabled{opacity:.45}#main [data-note]{text-align:left;width:100%}
</style></head><body>
<header class="top"><div><div class="brand">英语阅读标记器</div><div id="syncStatus">本机保存 · 尚未连接电脑</div></div><div class="row"><button class="small" data-page="settings">阅读</button><button class="small" id="audioSettings">发音</button><button class="small" id="syncNow">同步</button></div></header>
<nav class="tabs"><button data-page="articles">文章</button><button data-page="vocabulary">生词本</button><button data-page="notes">句子笔记</button><button data-page="connect">连接电脑</button></nav>
<main id="main"></main>
<div id="selectionBar" class="selectionBar" hidden><button id="selectionTranslate">翻译</button><button id="selectionSpeak">▶ 朗读</button><button id="selectionMark">划线</button><button id="selectionSave">存生词</button><button id="selectionNote">收藏句段</button></div>
<div id="lookupOverlay" class="overlay" hidden><section class="sheet"><div class="row"><h3 id="lookupTitle" class="grow"></h3><button class="small" id="closeLookup">关闭</button></div><div id="lookupDefinition" class="definition"></div><div class="actions"><button id="lookupSpeak">▶ 发音 / 朗读</button><button id="lookupMark">划线 / 取消</button><button id="lookupSave" class="primary">加入生词本</button><button id="lookupNote">收藏句段</button></div></section></div>
<div id="audioOverlay" class="overlay" hidden><section class="sheet"><h3>发音与语速</h3><label>朗读来源</label><select id="audioSource"><option value="dictionary">在线语音（单词词典＋整句朗读）</option><option value="system">系统英文语音</option></select><label>口音</label><select id="audioAccent"><option value="us">美式发音</option><option value="uk">英式发音</option></select><label>播放速度（单词、句子和全文）</label><select id="audioSpeed"><option value="0.6">0.6 倍速 · 更慢</option><option value="0.75">0.75 倍速 · 推荐</option><option value="0.9">0.9 倍速</option><option value="1">1 倍速 · 原速</option><option value="1.25">1.25 倍速 · 抗干扰</option></select><p class="muted">在线模式：单词用有道音频（无需电脑）；整句朗读自动选择可用通道——手机开全局 VPN 时可直连谷歌语音独立使用，或经电脑代理（微软神经语音，需电脑开机并开启同步），哪条路通用哪条，失败回退系统语音。系统模式可离线使用，声音取决于手机语音包。</p><div class="actions"><button id="saveAudioSettings" class="primary">保存设置</button><button id="cancelAudioSettings">取消</button></div></section></div>
<div id="toast" hidden></div>
<script src="sync-core.js"></script><script src="learning.js"></script><script src="app.js"></script></body></html>
