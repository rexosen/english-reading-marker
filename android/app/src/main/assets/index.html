<!doctype html>
<html lang="zh-CN" data-theme="paper"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3, viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>英语阅读标记器</title>
<style>
:root{
  --blue:#2d5bb9;--blue-hover:#224a9c;--blue-soft:#e9f0ff;--blue-soft-border:#c9dafc;
  --ink:#26231e;--title:#1a1714;--muted:#7a7367;--bg:#f3f1eb;--card:#ffffff;
  --border:#e5e0d5;--btn-bg:#f6f4ee;--input-bg:#ffffff;--top-bg:#f3f1ebf2;
  --sheet-bg:#ffffff;--toast-bg:#203044f2;--toast-fg:#ffffff;
  --underline:#d06a35;--vocab-bg:rgba(245,185,66,0.22);--missed-bg:rgba(239,68,68,0.16);--speaking-bg:rgba(255,204,102,0.45);
  --pos-bg:#eaf1ff;--pos-fg:#2558b8;--badge-l-bg:#e0f2fe;--badge-l-fg:#0369a1;
  --badge-r-bg:#dcfce7;--badge-r-fg:#15803d;--badge-c-bg:#f3e8ff;--badge-c-fg:#7e22ce;
  --ok-bg:#dcfce7;--ok-fg:#15803d;--ok-border:#86efac;
  --err-bg:#fee2e2;--err-fg:#b91c1c;--err-border:#fca5a5;
}
html[data-theme="light"]{
  --blue:#2f60c2;--blue-soft:#eaf1ff;--blue-soft-border:#c7d9fc;
  --ink:#203044;--title:#142235;--muted:#75849a;--bg:#f4f6fa;--card:#ffffff;
  --border:#e4e9f2;--btn-bg:#f3f6fb;--input-bg:#ffffff;--top-bg:#f4f6faf2;--sheet-bg:#ffffff;
}
html[data-theme="green"]{
  --blue:#2b6f4b;--blue-soft:#dff0e5;--blue-soft-border:#b8dec6;
  --ink:#223627;--title:#17291c;--muted:#617967;--bg:#eaf1e6;--card:#f7fbf5;
  --border:#d6e4d0;--btn-bg:#eef5eb;--input-bg:#ffffff;--top-bg:#eaf1e6f2;--sheet-bg:#f7fbf5;
  --pos-bg:#dcf0e3;--pos-fg:#1e5c3b;
}
html[data-theme="dark"]{
  --blue:#4c8dff;--blue-hover:#3b7cef;--blue-soft:#1f3252;--blue-soft-border:#33548a;
  --ink:#dde6f2;--title:#f1f5f9;--muted:#8c9bb0;--bg:#121720;--card:#1a212d;
  --border:#2a3444;--btn-bg:#232c3b;--input-bg:#151b25;--top-bg:#121720f2;
  --sheet-bg:#1a212d;--toast-bg:#e6edf3f2;--toast-fg:#121720;
  --underline:#f59e56;--vocab-bg:rgba(245,158,11,0.22);--missed-bg:rgba(239,68,68,0.26);--speaking-bg:rgba(250,204,21,0.32);
  --pos-bg:#253449;--pos-fg:#7cc0ff;--badge-l-bg:#17344f;--badge-l-fg:#60b8ff;
  --badge-r-bg:#163b2a;--badge-r-fg:#5ce09e;--badge-c-bg:#32224d;--badge-c-fg:#c49bff;
  --ok-bg:#163b2a;--ok-fg:#5ce09e;--ok-border:#256445;
  --err-bg:#451c22;--err-fg:#f87171;--err-border:#7f2f39;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,sans-serif;transition:background-color .18s,color .18s;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit}
select{width:100%;border:1px solid var(--border);border-radius:12px;padding:11px 12px;background:var(--input-bg);color:var(--ink)}
button{border:1px solid var(--border);border-radius:12px;padding:10px 14px;background:var(--btn-bg);color:var(--ink);cursor:pointer}
button:active{background:var(--blue-soft)}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600}
button.small{font-size:13.5px;padding:7px 11px;border-radius:10px}
button.speed-pill{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-soft-border);font-weight:700}
.top{position:sticky;top:0;z-index:10;background:var(--top-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(10px + env(safe-area-inset-top,0px)) 12px 9px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--border)}
.top-brand{flex:1;min-width:0}
.brand{font-weight:750;font-size:16.5px;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.subtitle,#syncStatus{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:5px;align-items:center;flex-shrink:0}
.top-actions button{white-space:nowrap;flex-shrink:0;font-size:12.5px;padding:6px 8px;border-radius:9px;line-height:1.2}
.top-progress{position:absolute;left:0;right:0;bottom:0;height:2.5px;background:transparent;pointer-events:none;display:none}
body.reading-mode .top-progress{display:block}
#topProgressFill{height:100%;width:0%;background:var(--blue);transition:width .18s}
.tabs{display:flex;gap:6px;padding:8px 12px;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap;font-size:13.5px;padding:8px 8px}
.tabs button.active{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-soft-border);font-weight:700}
body.reading-mode .tabs{padding:6px 12px 2px}
body.reading-mode .tabs button{padding:6px 8px;font-size:13px}
main{padding:4px 14px 100px;max-width:780px;margin:auto;transition:background-color .15s}
body.reading-mode main{padding-bottom:calc(136px + env(safe-area-inset-bottom,0px))}
.card{padding:16px;margin-bottom:12px;background:var(--card);border:1px solid var(--border);border-radius:16px;overflow-wrap:anywhere}
.row{display:flex;gap:8px;align-items:center}
.row .grow{flex:1;min-width:0}
.title{font-size:18px;font-weight:700;margin-bottom:5px;color:var(--title);overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:13.5px;line-height:1.55}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.empty{text-align:center;padding:36px 14px;line-height:1.8;color:var(--muted)}
label{display:block;font-size:14px;margin:16px 0 6px;color:var(--ink)}
input,textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--ink);background:var(--input-bg)}
textarea{min-height:200px;resize:vertical}
h2{font-size:21px;margin:10px 0;color:var(--title)}
.reader-header{margin:2px 0 8px}
.reader-header h2{font-size:19px;margin:4px 0 4px;line-height:1.35}
.reader-header #readerMeta{font-size:12.5px}
.reader-tip{font-size:12px;color:var(--muted);margin-top:2px}
#readingArea{white-space:pre-wrap;font-family:Georgia,'Times New Roman',serif;font-size:21px;line-height:1.75;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 18px;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
#readingArea .token{scroll-margin-top:86px;scroll-margin-bottom:140px}
#readingArea .marked{text-decoration:underline;text-decoration-color:var(--underline);text-underline-offset:5px;text-decoration-thickness:2px}
#readingArea .vocab-word{background:var(--vocab-bg);border-radius:3px}
#readingArea .missed{background:var(--missed-bg);border-radius:3px}
#readingArea .speaking{background:var(--speaking-bg)!important;border-radius:3px}
.progress-track{height:4px;background:var(--btn-bg);border-radius:99px;overflow:hidden;margin:6px 0 8px}
.progress-fill{height:100%;background:var(--blue);border-radius:99px;width:0%;transition:width .2s}
.player-backdrop{position:fixed;inset:0;background:rgba(10,16,28,0.28);z-index:11}
.player-dock{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--sheet-bg);border-top:1px solid var(--border);box-shadow:0 -6px 24px rgba(0,0,0,.1);padding:7px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.player-dock-inner{max-width:760px;margin:0 auto}
.dock-drawer{padding:6px 2px 10px;margin-bottom:8px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:9px;max-height:56vh;overflow-y:auto}
.dock-drawer-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dock-drawer-title{font-size:13px;font-weight:700;color:var(--title)}
.dock-quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dock-quick-grid button{padding:8px 4px;font-size:12.5px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.dock-speed-strip{display:flex;align-items:center;gap:6px}
.dock-speed-label{font-size:12px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.dock-speed-pills{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;flex:1;min-width:0}
.dock-speed-pills button{padding:6px 2px;font-size:12px;border-radius:8px;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:center}
.dock-speed-pills button.active{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-soft-border);font-weight:700}
.dock-setting-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dock-setting-row select{width:auto;min-width:98px;padding:6px 8px;font-size:12.5px;border-radius:9px}
.dock-setting-row input[type="number"]{width:50px;padding:6px 4px;font-size:12.5px;border-radius:9px;text-align:center}
.dock-check-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dock-check-label{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:13px;color:var(--ink)}
.dock-check-label input{width:auto;margin:0}
.dock-status-row{display:flex;align-items:center;gap:6px;margin-bottom:7px;min-height:28px}
.dock-status-text{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-mini-actions{display:flex;align-items:center;gap:5px;flex-shrink:0}
.dock-mini-btn{padding:4px 8px;font-size:12px;border-radius:8px;white-space:nowrap;flex-shrink:0;line-height:1.25}
.dock-mini-btn.icon-only{padding:4px 8px;font-size:13px}
.dock-mini-btn.is-heard{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-border);font-weight:700}
.dock-mini-btn.is-missed{background:var(--err-bg);color:var(--err-fg);border-color:var(--err-border);font-weight:700}
.dock-transport{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.dock-transport button{white-space:nowrap;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:11px;line-height:1;padding:0 10px;font-size:13.5px}
.dock-speed-btn{width:56px;min-width:56px;padding:0 4px!important;flex-shrink:0;font-size:13px!important;font-variant-numeric:tabular-nums}
.dock-step-btn{flex-shrink:0;padding:0 10px!important;font-size:13px!important}
.dock-play-btn{flex:1;min-width:78px;font-weight:700}
.dock-more-btn{width:42px;min-width:42px;padding:0!important;flex-shrink:0;position:relative;font-size:15px!important}
.dock-more-btn.has-badge::after{content:'';position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.dock-more-btn.open{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-soft-border)}
body.has-selection #playerDock,body.has-selection #playerBackdrop{display:none!important}
.selectionBar{position:fixed;bottom:0;left:0;right:0;padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));background:var(--sheet-bg);border-top:1px solid var(--border);box-shadow:0 -4px 18px rgba(0,0,0,.12);z-index:14;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.selectionBar button{font-size:13px;padding:8px 10px;white-space:nowrap}
.overlay{position:fixed;inset:0;background:rgba(10,16,28,0.52);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:720px;max-height:80vh;overflow:auto;background:var(--sheet-bg);color:var(--ink);border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 28px rgba(0,0,0,.22)}
.sheet h3{margin:4px 0 12px;overflow-wrap:anywhere;font-size:19px;color:var(--title)}
.sheet textarea{min-height:110px}
.sheet .actions{flex-wrap:wrap}
.definition{line-height:1.65;max-height:38vh;overflow:auto;overflow-wrap:anywhere;color:var(--ink)}
.pos-pill{display:inline-block;background:var(--pos-bg);color:var(--pos-fg);font-weight:700;font-size:12px;padding:1px 6px;border-radius:5px;margin-right:6px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.badge-listening{background:var(--badge-l-bg);color:var(--badge-l-fg)}
.badge-reading{background:var(--badge-r-bg);color:var(--badge-r-fg)}
.badge-custom{background:var(--badge-c-bg);color:var(--badge-c-fg)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0 14px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}
.stat-num{font-size:22px;font-weight:750;color:var(--title);margin:4px 0}
.conflict{border-left:4px solid #e3a653}
#toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-fg);padding:9px 15px;border-radius:12px;max-width:90%;z-index:40;font-size:13.5px;pointer-events:none;text-align:center}
body.reading-mode #toast{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
body.drawer-open #toast{top:calc(68px + env(safe-area-inset-top,0px));bottom:auto}
[hidden]{display:none!important}
a{color:var(--blue)}
.reviewWord{font-size:34px;font-weight:750;padding:12px 0 6px;color:var(--title)}
.reviewContext{white-space:pre-wrap;line-height:1.85;font-size:16px}
.noteText{white-space:pre-wrap;line-height:1.75}
.preview{min-height:140px;padding:16px;border-radius:14px;border:1px solid var(--border)}
button:disabled{opacity:.45}
#main [data-note]{text-align:left;width:100%}
</style></head><body>
<header class="top"><div class="top-brand"><div class="brand">英语阅读标记器</div><div id="syncStatus">本机保存 · 尚未连接电脑</div></div><div class="top-actions"><button class="small" data-page="stats">统计</button><button class="small" data-page="settings">显示</button><button class="small" id="audioSettings">发音</button><button class="small" id="syncNow">同步</button></div><div class="top-progress" aria-hidden="true"><div id="topProgressFill"></div></div></header>
<nav class="tabs"><button data-page="articles">文章</button><button data-page="vocabulary">生词本</button><button data-page="notes">句子笔记</button><button data-page="connect">连接电脑</button></nav>
<main id="main"></main>
<div id="playerBackdrop" class="player-backdrop" hidden></div>
<section id="playerDock" class="player-dock" hidden aria-label="精听播放控制"></section>
<div id="selectionBar" class="selectionBar" hidden><button id="selectionTranslate">翻译</button><button id="selectionSpeak">▶ 朗读</button><button id="selectionMark">划线</button><button id="selectionSave" class="primary">存生词</button><button id="selectionNote">收藏句段</button></div>
<div id="lookupOverlay" class="overlay" hidden><section class="sheet"><div class="row"><h3 id="lookupTitle" class="grow"></h3><button class="small" id="closeLookup">关闭</button></div><div id="lookupDefinition" class="definition"></div><div class="actions"><button id="lookupSpeak">▶ 发音 / 朗读</button><button id="lookupMark">划线 / 取消</button><button id="lookupSave" class="primary">加入生词本</button><button id="lookupNote">收藏句段</button></div></section></div>
<div id="audioOverlay" class="overlay" hidden><section class="sheet"><h3>发音与语速</h3><label>朗读来源</label><select id="audioSource"><option value="dictionary">在线语音（单词词典＋整句朗读）</option><option value="system">系统英文语音</option></select><label>口音</label><select id="audioAccent"><option value="us">美式发音</option><option value="uk">英式发音</option></select><label>播放速度（单词、句子和全文）</label><select id="audioSpeed"><option value="0.6">0.6 倍速 · 更慢</option><option value="0.75">0.75 倍速 · 推荐</option><option value="0.9">0.9 倍速</option><option value="1">1 倍速 · 原速</option><option value="1.25">1.25 倍速 · 抗干扰</option></select><p class="muted">在线模式：单词用有道音频（无需电脑）；整句朗读自动选择可用通道——手机开全局 VPN 时可直连谷歌语音独立使用，或经电脑代理（微软神经语音，需电脑开机并开启同步），哪条路通用哪条，失败回退系统语音。系统模式可离线使用，声音取决于手机语音包。</p><div class="actions"><button id="saveAudioSettings" class="primary">保存设置</button><button id="cancelAudioSettings">取消</button></div></section></div>
<div id="toast" hidden></div>
<script src="sync-core.js"></script><script src="learning.js"></script><script src="app.js"></script></body></html>
